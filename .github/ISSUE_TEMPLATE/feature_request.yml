name: Feature request
description: Propose a focused improvement to the performance debugging workflow.
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user workflow and why existing features do not cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution and alternatives
      description: Include expected behavior, tradeoffs, and privacy considerations where relevant.
    validations:
      required: true
