name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for browser checks
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify browser SDK in Chromium
        run: pnpm test:browser
      - name: Validate Studio UX in Chromium
        run: pnpm test:studio && pnpm test:studio:visual
      - name: Upload Studio UX diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-ux-diagnostics
          path: test-results/studio-ux
          if-no-files-found: ignore
          retention-days: 7
      - name: Enforce browser SDK size and overhead budgets
        run: pnpm size:browser && pnpm bench:browser
      - run: pnpm docs:build
      - name: Verify committed action bundle
        run: git diff --exit-code -- packages/action/dist/index.cjs
      - run: node scripts/release.mjs npm
      - run: node scripts/smoke-release.mjs
  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run the repository action
        id: budget
        uses: ./
        with:
          trace-file: examples/traces/slow-settings.json
          config-file: examples/budgets/tracelens.yml
          upload-artifact: false
          create-check: false
          comment: never
          fail-on-budget: false
      - name: Verify fail-closed output
        if: steps.budget.outputs.passed != 'false'
        run: exit 1
